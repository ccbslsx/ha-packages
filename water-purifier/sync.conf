# water-purifier —— 同步清单
#
# 本文件被 scripts/deploy.sh 读取（bash source）。
# 新包照抄此文件，改成本包自己的路径即可。

# 远端要打包拉取的目录/文件（相对 HA 的 /homeassistant）
TAR_PATHS=(
  "water_purifier/"
  "automations/water_purifier/"
)

# HA 侧改动前做 .bak 备份的目录（一般与 TAR_PATHS 一致）
BACKUP_PATHS=(
  "water_purifier/"
  "automations/water_purifier/"
)

# 目录映射：「远端目录:本地相对目录」（相对本包目录）
DIR_MAP=(
  "water_purifier:config/water_purifier"
  "automations/water_purifier:config/automations/water_purifier"
)

# configuration.yaml：脱敏后落到本包 config/configuration.example.yaml
CONFIG_YAML="configuration.yaml"

# Lovelace 视图：远端 path（视图的 path 字段）→ 本地导出位置
DASHBOARD_VIEW_PATH="waterpurifier"
DASHBOARD_LOCAL="dashboard/lovelace_waterpurifier_view.json"
