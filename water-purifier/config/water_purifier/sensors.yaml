# 净水机滤芯剩余时间（基于 input_datetime + input_number 自定义寿命）
- name: time_remaining_pp_10inch
  unique_id: time_remaining_pp_10inch
  icon: mdi:clock-end
  state: >
    {% set date_str = states('input_datetime.waterpurifier_change_time_pp_10inch') %}
    {% set total_days = states('input_number.use_date_pp_10inch') | float(default=365) %}
    {% if date_str is none or date_str == 'unknown' %}
      未设置日期
    {% else %}
      {% set install_ts = as_timestamp(date_str) %}
      {% set now_ts = as_timestamp(now()) %}
      {% set used_days = ((now_ts - install_ts) / 86400) | int %}
      {% set remaining_days = (total_days - used_days) | int %}
      {% if remaining_days <= 0 %}
        已到期
      {% elif remaining_days < 30 %}
        {{ remaining_days }}天
      {% else %}
        {{ remaining_days }}天
      {% endif %}
    {% endif %}

