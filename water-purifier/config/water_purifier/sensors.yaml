# RO脱盐率传感器
- name: "ro_salt_rejection"
  unique_id: ro_salt_rejection
  unit_of_measurement: "%"
  icon: "mdi:water-percent"
  state: >
    {% set raw = states('sensor.tds_esp8266_tds2') | float(0) %}
    {% set pure = states('sensor.tds_esp8266_tds1') | float(0) %}
    {% if raw > 0 %}
      {{ ((raw - pure) / raw * 100) | round(1) }}
    {% else %}
      0
    {% endif %}

