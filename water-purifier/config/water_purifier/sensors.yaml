# 净水机PP棉使用天数
- name: "days_used_pp_10inch"
  unique_id: days_used_pp_10inch
  icon: "mdi:calendar-clock"
  state: >
    {% set date_str = states('input_datetime.waterpurifier_change_time_pp_10inch', 'date') %}
    {% if date_str is none %}
      未设置日期
    {% else %}
      {% set dt = strptime(date_str, '%Y-%m-%d %H:%M:%S') %}
      {% set ts = as_timestamp(dt) %}
      {% set now_ts = as_timestamp(now()) %}
      {% set seconds = now_ts - ts %}
      {% set days = (seconds / 86400) | int %}
      {% set hours = ((seconds % 86400) / 3600) | int %}
      {% if days > 0 and hours > 0 %}
        {{ days }}天{{ hours }}小时
      {% elif days > 0 %}
        {{ days }}天
      {% else %}
        {{ hours }}小时
      {% endif %}
    {% endif %}

