# 入户20寸PP棉状态
- name: "waterpurifier_pp_20inch_used"
  unique_id: waterpurifier_pp_20inch_used
  icon: "mdi:water-pump"
  unit_of_measurement: "L"
  availability: "{{ has_value('sensor.0021030105848_ben_ci_chao_ma') }}"
  state: >
    {% set meter = states('sensor.0021030105848_ben_ci_chao_ma') | float(0) %}
    {% set base = states('input_number.waterpurifier_start_pp_20inch') | float(0) %}
    {% set used = (meter - base) * 1000 %}
    {% if used < 0 %} 0 {% else %} {{ used | round(1) }} {% endif %}

- name: "status_pp_20inch"
  unique_id: status_pp_20inch
  icon: "mdi:filter"
  state: >
    {% set change_time = states('input_datetime.waterpurifier_change_time_pp_20inch') %}
    {% if change_time in ['unknown', 'unavailable', none] %}
      未设置
    {% else %}
      {% set dt = strptime(change_time, '%Y-%m-%d %H:%M:%S') %}
      {% set days = ((as_timestamp(now()) - as_timestamp(dt)) / 86400) | int %}
      {% if days >= (states('input_number.use_date_pp_20inch') | int(0)) %} 更换
      {% elif days >= ((states('input_number.use_date_pp_20inch') | int(0)) - 35) %} 警告
      {% else %} 正常
      {% endif %}
    {% endif %}