# RO膜状态
- name: "status_ro"
  unique_id: status_ro
  icon: "mdi:filter"
  state: >
    {% set desal = states('sensor.ro_salt_rejection') | float(-1) %}
    {% set pure_tds = states('sensor.tds_esp8266_tds1') | float(-1) %}
    {% set change_time = states('input_datetime.waterpurifier_change_time_ro') %}
    {% if change_time in ['unknown', 'unavailable', none] %}
      未设置
    {% else %}
      {% set dt = strptime(change_time, '%Y-%m-%d %H:%M:%S') %}
      {% set days = ((as_timestamp(now()) - as_timestamp(dt)) / 86400) | int %}
      
      {# 脱盐率越低越差: <90%警告 / <85%更换 ; 纯水TDS越高越差: >15警告 / >25更换 #}
      {% set warn = (desal >= 0 and desal < 90) or (pure_tds >= 0 and pure_tds > 15) %}
      {% set repl = (desal >= 0 and desal < 85) or (pure_tds >= 0 and pure_tds > 25) %}
      {% if repl %} 更换
      {% elif warn %} 警告
      {% else %}
        {% if days >= (states('input_number.use_date_ro') | int(0)) %} 更换
        {% elif days >= ((states('input_number.use_date_ro') | int(0)) // 2) %} 警告
        {% else %} 正常
        {% endif %}
      {% endif %}
    {% endif %}
- name: "status_t33"
  unique_id: status_t33
  icon: "mdi:filter"
  state: >
    {% set used_water = states('sensor.waterpurifier_t33_used') | float(0) %}
    {% set change_time = states('input_datetime.waterpurifier_change_time_t33') %}
    {% if change_time in ['unknown', 'unavailable', none] %}
      未设置
    {% else %}
      {% set dt = strptime(change_time, '%Y-%m-%d %H:%M:%S') %}
      {% set days_used = ((as_timestamp(now()) - as_timestamp(dt)) / 86400) | int %}
    {% endif %}
    {% if used_water >= 1200 or days_used >= (states('input_number.use_date_t33') | int(0)) %}
      更换
    {% elif used_water >= 1000 or days_used >= ((states('input_number.use_date_t33') | int(0)) // 2) %}
      警告
    {% else %}
      正常
    {% endif %}
