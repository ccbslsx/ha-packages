##############滤芯状态#########################################
# 净水机PP棉状态
- name: "status_pp_10inch"
  unique_id: status_pp_10inch
  icon: "mdi:filter"
  state: >
    {% set change_time = states('input_datetime.waterpurifier_change_time_pp_10inch') %}
    {% if change_time in ['unknown', 'unavailable', none] %}
      未设置
    {% else %}
      {% set dt = strptime(change_time, '%Y-%m-%d %H:%M:%S') %}
      {% set days = ((as_timestamp(now()) - as_timestamp(dt)) / 86400) | int %}
      {% if days >= (states('input_number.use_date_pp_10inch') | int(0)) %} 更换
      {% elif days >= ((states('input_number.use_date_pp_10inch') | int(0)) // 2) %} 警告
      {% else %} 正常
      {% endif %}
    {% endif %}
- name: "status_udf"
  unique_id: status_udf
  icon: "mdi:filter-variant"
  state: >
    {% set used_water = states('sensor.waterpurifier_udf_used') | float(0) %}
    {% set change_time = states('input_datetime.waterpurifier_change_time_udf') %}
    {% if change_time in ['unknown', 'unavailable', none] %}
      未设置
    {% else %}
      {% set dt = strptime(change_time, '%Y-%m-%d %H:%M:%S') %}
      {% set days_used = ((as_timestamp(now()) - as_timestamp(dt)) / 86400) | int %}
    {% endif %}
    {% if used_water >= 1200 or days_used >= (states('input_number.use_date_udf') | int(0)) %}
      更换
    {% elif used_water >= 1000 or days_used >= ((states('input_number.use_date_udf') | int(0)) // 2) %}
      警告
    {% else %}
      正常
    {% endif %}
