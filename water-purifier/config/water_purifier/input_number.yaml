# ESP8266 纯水累计（HA侧累加，防设备断电归零丢数）
esp_purified_accum:
  name: ESP纯水累计(HA侧)
  min: 0
  max: 9999999
  step: 0.001
  mode: box
  unit_of_measurement: L

esp_purified_last:
  name: ESP纯水原始读数(上次)
  min: 0
  max: 9999999
  step: 0.001
  mode: box
  unit_of_measurement: L
