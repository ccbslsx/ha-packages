- alias: "WaterPurifier: ESP纯水累计(HA侧)"
  mode: queued
  max: 10
  trigger:
    - platform: state
      entity_id: sensor.tds_esp8266_total_purified_water_usage
  condition:
    - condition: template
      value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable', 'none'] }}"
  action:
    - variables:
        cur: "{{ trigger.to_state.state | float(0) }}"
        prev: "{{ states('input_number.esp_purified_last') | float(0) }}"
        accum: "{{ states('input_number.esp_purified_accum') | float(0) }}"
        delta: "{{ (cur - prev) if cur >= prev else cur }}"
    - service: input_number.set_value
      data:
        entity_id: input_number.esp_purified_accum
        value: "{{ (accum + delta) | round(3) }}"
    - service: input_number.set_value
      data:
        entity_id: input_number.esp_purified_last
        value: "{{ cur }}"
