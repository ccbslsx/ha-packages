- alias: "WaterPurifier: 提醒净水机PP棉更换"
  trigger:
    - platform: state
      entity_id: sensor.status_pp_10inch
      to:
        - "警告"
        - "更换"
      for: "00:10:00"
  action:
    - service: notify.gotify
      data:
        title: "⚠️ 净水机PP棉需更换！"
        message: "## 🛠 滤芯更换提醒\n
        \n检测到 **净水机PP棉** 需要更换！\n
        \n### 📊 当前状态\n
        | 项目         | 数值       |\n
        |--------------|------------|\n
        | 已用制水量   | {{ states('sensor.waterpurifier_pp_10inch_used') | round(2)}} L |\n
        | 已使用时间   | {{ states('sensor.days_used_pp_10inch') }} |\n
        \n请尽快更换滤芯，确保净水效果。\n
        \n*推送时间：{{ now().strftime('%Y-%m-%d %H:%M') }}*"
        data:
          extras:
            client::display:
              contentType: text/markdown
  mode: single

